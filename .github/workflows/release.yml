# Gắn tag v* (vd. v0.1.0) → kiểm đủ, build, đóng gói mọi package thành .tgz và
# đính kèm vào GitHub Release. Repo frontend cài thẳng từ URL của file .tgz,
# khoá theo tag — nâng phiên bản là một dòng diff trong package.json bên đó.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

      - name: Tag phải khớp version của các gói
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for pkg in packages/core packages/contracts; do
            VERSION=$(node -p "require('./$pkg/package.json').version")
            if [ "$VERSION" != "$TAG" ]; then
              echo "$pkg có version $VERSION, tag là $TAG" >&2
              exit 1
            fi
          done

      - name: Đóng gói
        run: npm pack -w @mambo/core -w @mambo/contracts

      - name: Tạo release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.tgz --title "$GITHUB_REF_NAME" --notes-file packages/contracts/CHANGELOG.md
