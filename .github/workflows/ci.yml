name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Kiểm kiểu
        run: npm run typecheck

      - name: Ranh giới gói (core thuần)
        run: npm run boundaries

      - name: Test (core phủ ≥80%)
        run: npm run test

      - name: Build
        run: npm run build
